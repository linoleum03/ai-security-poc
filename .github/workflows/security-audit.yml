name: AI Security Audit

on:
  push:
    branches:
      - ai-security/security-fix-poc

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Run AI Security Audit
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          cat > /tmp/security-audit-prompt.txt <<'EOF'
          GitHubへのpushをトリガーとして、自動セキュリティ監査を実施してください。

          今回の監査対象は、以下のGit差分です。

          変更前コミット:
          ${{ github.event.before }}

          変更後コミット:
          ${{ github.sha }}

          対象ブランチ:
          ${{ github.ref_name }}

          まず以下のGit差分を確認してください。

          git diff ${{ github.event.before }} ${{ github.sha }}

          今回のpushによって追加・変更された内容を
          セキュリティの観点から監査してください。

          ただし、差分だけを見て判断してはいけません。

          脆弱性の有無や影響を正しく判断するために必要であれば、
          関連するソースコードも調査してください。

          特に以下を確認してください。

          - 認証の回避
          - 認可不備
          - IDOR
          - SQLインジェクション
          - コマンドインジェクション
          - XSS
          - CSRF
          - SSRF
          - 安全でないファイル処理
          - 機密情報・個人情報の漏洩
          - ソースコードへのシークレット埋め込み
          - 機密情報の不適切なログ出力
          - Laravel固有のセキュリティ問題
          - React固有のセキュリティ問題

          誤検知をできるだけ避けてください。

          実際にセキュリティ上の問題となる可能性があるものだけを
          Findingとして報告してください。

          この監査は読み取り専用です。

          以下の操作は禁止します。

          - ファイルの変更
          - ファイルの新規作成
          - commit
          - push
          - ブランチ作成
          - Pull Request作成

          Findingを発見した場合は、それぞれ以下を日本語で報告してください。

          - Severity
          - Finding名
          - 対象ファイル
          - 対象コード
          - 問題の説明
          - なぜ脆弱なのか
          - 想定される攻撃方法
          - 想定される影響
          - 推奨修正方法
          - Confidence

          問題が存在しない場合は、
          「今回の変更から明確なセキュリティFindingは検出されませんでした」
          と明記してください。
          EOF

          claude -p "$(cat /tmp/security-audit-prompt.txt)" \
            --max-turns 15 \
            --allowedTools "Read" "Glob" "Grep" "Bash(git diff:*)" "Bash(git show:*)" "Bash(git log:*)" \
            --disallowedTools "Edit" "Write" \
            --output-format text \
            | tee security-audit-result.txt

      - name: Show Security Findings
        if: always()
        shell: bash
        run: |
          echo "## AI Security Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f security-audit-result.txt ]; then
            cat security-audit-result.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "監査結果を取得できませんでした。" >> "$GITHUB_STEP_SUMMARY"
          fi